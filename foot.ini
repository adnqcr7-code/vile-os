# Vile OS — foot terminal theme.
# The compositor tiles foot windows; foot draws its own title bar
# (client-side decorations). Without this file that bar is WHITE —
# the #1 look break in the whole system. This file makes it dark
# Vile purple, matching the Settings headerbar.
#
# GOTCHA (foot 1.16, man foot.ini "SECTION: csd"): csd colours are
# AARRGGBB — 8 hex digits, alpha first. A 6-digit value like
# "241640" is read as alpha 00 = FULLY TRANSPARENT, so the
# compositor's purple focus border showed through the title bar
# instead of the dark purple. Always use ff-prefixed 8-digit
# values here.
#
# Install: mkdir -p ~/.config/foot && cp foot.ini ~/.config/foot/foot.ini
[main]
font=JetBrains Mono:size=11

# RENAMED Nov 10, 2026: plain [colors] is INVALID in foot 1.28 (the Arch
# Nov 2026 version) — it errors "invalid section name: colors" and the
# terminal falls back to default fg/bg. Newer foot splits the theme into
# [colors-dark] / [colors-light], selected by initial-color-theme in
# [main]; the default theme is colors-dark. Vile is dark-only, so this
# section is [colors-dark]. (The [csd] title-bar section is separate and
# was never affected — that is why the title bar was still dark purple
# even with the [colors] error.) VERIFIED in a booted ISO Nov 10, 2026
# (v0.5.1): terminal opens with a plain prompt, no error line,
# background #0F0B1A, title bar #241640.
[colors-dark]
background=0f0b1a
foreground=ede9fe

[csd]
preferred=client
size=26
color=ff241640
button-color=ffede9fe
button-minimize-color=ff2a2140
button-maximize-color=ff2a2140
button-close-color=ff2a2140
hide-when-maximized=false
