# Vile OS — GRUB (UEFI) boot menu. Placeholders %...% are filled by mkarchiso.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod jpeg
insmod png

set timeout=5
set default=0

menuentry "Vile OS (x86_64)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Vile OS (x86_64, fallback initramfs)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-fallback.img
}
