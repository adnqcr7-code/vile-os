# Vile OS — SYSLINUX (BIOS) boot menu. Placeholders %...% are filled by mkarchiso.
DEFAULT arch
TIMEOUT 50
UI vesamenu.c32
MENU TITLE Vile OS
MENU BACKGROUND splash.png
MENU CLEAR
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 6
MENU TIMEOUTROW 16
MENU TABMSGROW 18
MENU CMDLINEROW 18
MENU HELPMSGROW 20
MENU HELPMSGENDROW 29
MENU COLOR border       30;44   #40ffffff #00000000 std
MENU COLOR title        1;36;44 #ffffffff #00000000 std

LABEL arch
  MENU LABEL Vile OS (x86_64)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% %KERNEL_PARAMS%

LABEL arch_fallback
  MENU LABEL Vile OS (x86_64, fallback initramfs)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-fallback.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% %KERNEL_PARAMS%

LABEL memtest
  MENU LABEL Run Memtest86+ (RAM test)
  LINUX /boot/memtest86+/memtest
